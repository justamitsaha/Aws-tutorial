- question: What is IOPS?
  answer: >
    I/O Operations Per Second. Makes sence when used with latency

- question: Bandwidth or Throughput?
  answer: >
    IOPS * avg request size

- question: latency?
  answer: >
    Time taken for a I/O request to be complete. We start our measurement from the moment the request is issued to the storage layer and stop measuring when either we get the requested data or get confirmation that the data is stored on disk

- question: EBS?
  answer: Elastic Block store. It is a network storage to store data in the form of blocks. 

- question: Use case for ESB?
  answer: >
    It is used to store data for 
    EC2 instances,
    RDS instances,
    Redshift instances, 
    ElastiCache instances,
    Lambda functions, 
    ECS tasks, 
    EKS pods, 
    Fargate tasks.

- question: How to persist EC2 data?
  answer: >
    Use ESB to persist data

- question: Can EBS volumes be attached to multiple instances?
  answer: >
    No, EBS volumes can only be attached to one instance at a time. 

- question: Can we mount ESB from one region on EC2 on another?
  answer: >
    No EBS is locked to region

- question: If we want to stay in Free tier how much ESB can we provision?
  answer: >
    30 GB gp2/gp3 SSD

- question: Our EC2 instance is running critical job on ESB is having hardward issue? What to do?
  answer: > 
    ESB can be reattached quickly to another instance

- question: How to attach our citical data on ESB to another EC2 on another region
  answer: > 
    Create spanshot move snapshot to another region and recreate ESB in another region

- question: Can EBS be terminated on EC2 termination?
  answer: > 
    Yes with Delete on Termination attribute both root and ESB termination  can be controilled      

